name: Build (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      run_signing:
        description: "Sign Windows installer with Azure Trusted Signing (requires secrets)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHON: python
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/ocr/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app (unsigned)
        if: inputs.run_signing != 'true'
        run: npm run build:win -- --publish never

      - name: Build signed Windows app
        if: inputs.run_signing == 'true'
        run: npm run build:win:private-trust -- --publish never

      - name: Normalize artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $dir = "release/$version"
          Copy-Item "$dir/Openscreen Setup $version.exe" "$dir/Openscreen-Setup-$version.exe" -Force
          Copy-Item "$dir/Openscreen Setup $version.exe.blockmap" "$dir/Openscreen-Setup-$version.exe.blockmap" -Force
          (Get-Content "$dir/latest.yml" -Raw) -replace [regex]::Escape("Openscreen Setup $version.exe"), "Openscreen-Setup-$version.exe" |
            Set-Content "$dir/latest.yml" -Encoding utf8NoBOM
          $hash = (Get-FileHash "$dir/Openscreen-Setup-$version.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Openscreen-Setup-$version.exe" | Set-Content "$dir/Openscreen-Setup-$version.exe.sha256" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*/Openscreen-Setup-*.exe
            release/*/Openscreen-Setup-*.exe.blockmap
            release/*/latest.yml
          if-no-files-found: warn
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app (unsigned dmg, x64 + arm64)
        run: npm run build:mac -- --publish never

      - name: Verify dmg files exist
        run: ls release/*/Openscreen-Mac-*.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*/Openscreen-Mac-*.dmg
            release/*/latest-mac.yml
          if-no-files-found: warn
          retention-days: 14
